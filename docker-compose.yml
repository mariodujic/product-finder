name: product-finder

x-database-url: &database-url postgresql://productfinder:productfinder@db:5432/productfinder

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: productfinder
      POSTGRES_PASSWORD: productfinder
      POSTGRES_DB: productfinder
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productfinder -d productfinder"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply migrations, import data/products.csv, add demo reviews. Runs on
  # every `docker compose up`; safe because every step is idempotent and user reviews
  # are never touched.
  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      DATABASE_URL: *database-url
      # Set to "false" to start without the sample reviews marked "(demo)".
      SEED_DEMO_REVIEWS: ${SEED_DEMO_REVIEWS:-true}
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      PORT: 3000
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4200:80"

volumes:
  db-data:
